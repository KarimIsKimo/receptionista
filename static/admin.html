<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Jothen Operations</title>
  <style>
    :root{--bg:#f4f6f9;--panel:#fff;--panel2:#f8fafc;--line:#e5e9ef;--text:#18212f;--muted:#697586;--brand:#6847d8;--brand2:#efeaff;--green:#138a62;--greenbg:#e9f8f2;--amber:#ad6b00;--amberbg:#fff6df;--red:#c23b4a;--redbg:#fff0f2;--blue:#2563b8;--shadow:0 10px 30px rgba(24,33,47,.08);--radius:16px;font-family:Inter,"Segoe UI",Tahoma,Arial,sans-serif}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);overflow:hidden}
    button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .app{display:grid;grid-template-columns:220px minmax(0,1fr);height:100dvh}
    .sidebar{background:#171a25;color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:22px}
    .logo{display:flex;align-items:center;gap:10px;padding:4px 8px}.logo-mark{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#9e86ff,#6543db);display:grid;place-items:center;font-weight:800}.logo small{display:block;color:#aeb5c4;margin-top:2px}
    .nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#bbc1ce;border-radius:12px;padding:12px;text-align:start;display:flex;align-items:center;gap:10px}.nav button:hover,.nav button.active{background:#292d3d;color:#fff}.nav .icon{width:24px;text-align:center}
    .sidebar-foot{margin-top:auto;display:grid;gap:10px}.lang,.global-bot{border:1px solid #383d50;background:#222635;color:#fff;border-radius:11px;padding:10px}.global-bot span{display:block;font-size:12px;color:#aeb5c4;margin-bottom:4px}
    .main{min-width:0;height:100dvh;display:flex;flex-direction:column}.topbar{height:68px;flex:0 0 68px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.topbar h1{font-size:20px;margin:0}.topbar-actions{display:flex;align-items:center;gap:10px}.status-dot{width:9px;height:9px;border-radius:50%;background:#a1a8b3}.status-dot.healthy{background:var(--green)}.status-dot.degraded{background:#e0a21a}.status-dot.unavailable{background:var(--red)}
    .view{display:none;min-height:0;flex:1}.view.active{display:flex}.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 13px;border-radius:10px}.btn:hover{border-color:#c9cfd8}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.danger{color:var(--red);border-color:#f0c4ca}.btn.small{padding:6px 9px;font-size:12px}.icon-btn{width:38px;height:38px;padding:0;display:grid;place-items:center}
    .inbox-shell{display:grid;grid-template-columns:340px minmax(430px,1fr) 310px;width:100%;min-height:0}.patient-pane,.chat-pane,.profile-pane{background:var(--panel);min-height:0}.patient-pane{border-inline-end:1px solid var(--line);display:flex;flex-direction:column}.profile-pane{border-inline-start:1px solid var(--line);overflow:auto}.pane-head{padding:16px;border-bottom:1px solid var(--line)}.pane-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.pane-title h2{font-size:17px;margin:0}.search{position:relative}.search input{width:100%;border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:10px 12px;color:var(--text);outline:none}.search input:focus{border-color:var(--brand)}
    .filters{display:flex;gap:7px;overflow:auto;padding:10px 16px;border-bottom:1px solid var(--line);scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 10px;font-size:12px;color:var(--muted)}.chip.active{background:var(--brand2);border-color:#cfc3ff;color:var(--brand);font-weight:600}
    .patient-list{overflow:auto;min-height:0;flex:1}.patient-card{width:100%;border:0;border-bottom:1px solid #eef1f4;background:#fff;padding:13px 15px;text-align:start;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px}.patient-card:hover,.patient-card.active{background:#f7f5ff}.avatar{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#eee8ff,#d8ccff);color:var(--brand);display:grid;place-items:center;font-weight:800}.patient-meta{min-width:0}.patient-line{display:flex;align-items:center;gap:6px}.patient-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.phone{font-size:11px;color:var(--muted);direction:ltr;text-align:start}.preview{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}.card-side{text-align:end;font-size:11px;color:var(--muted)}.unread{display:inline-grid;place-items:center;background:var(--brand);color:#fff;min-width:20px;height:20px;padding:0 5px;border-radius:10px;font-size:10px;margin-top:7px}.mini-tags{display:flex;gap:4px;margin-top:6px;overflow:hidden}.tag{display:inline-block;background:#eef1f6;color:#566274;padding:3px 7px;border-radius:8px;font-size:10px;white-space:nowrap}.state{width:8px;height:8px;border-radius:50%;display:inline-block}.state.ai{background:var(--green)}.state.human{background:var(--amber)}.appointment-badge{display:inline-block;background:var(--greenbg);color:var(--green);padding:3px 7px;border-radius:8px;font-size:10px;margin-top:5px}.appointment-unknown{color:#9299a5;font-size:10px;margin-top:5px}
    .chat-pane{display:flex;flex-direction:column;min-width:0}.chat-header{min-height:74px;border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.chat-person{display:flex;gap:10px;align-items:center;min-width:0}.chat-person h2{font-size:16px;margin:0}.chat-sub{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}.quick-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.messages{flex:1;overflow:auto;padding:18px;background:#f7f8fb;display:flex;flex-direction:column;gap:10px}.load-older{align-self:center}.message{max-width:75%;padding:10px 12px;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}.message.user{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-right-radius:4px}.message.model{align-self:flex-end;background:var(--brand2);color:#352275;border-bottom-left-radius:4px}.message.staff{align-self:flex-end;background:#e4f4ff;color:#164d74;border-bottom-left-radius:4px}.message.system{align-self:center;max-width:90%;background:var(--redbg);color:var(--red);border:1px solid #ffd2d8;text-align:center;font-size:12px}.message-role{font-size:10px;font-weight:700;opacity:.72;margin-bottom:4px}.message-time{font-size:10px;opacity:.58;margin-top:5px;direction:ltr}.composer{border-top:1px solid var(--line);background:#fff;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.composer textarea{resize:none;min-height:43px;max-height:110px;border:1px solid var(--line);border-radius:12px;padding:10px;outline:none}.composer textarea:focus{border-color:var(--brand)}
    .empty{height:100%;display:grid;place-items:center;color:var(--muted);text-align:center;padding:30px}.empty strong{display:block;color:var(--text);margin-bottom:5px}.profile-content{padding:18px}.profile-card{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}.profile-card h3{font-size:13px;margin:0 0 12px}.field{margin-bottom:10px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}.field div{font-size:13px;word-break:break-word}.profile-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.appointment-row{padding:9px;background:var(--panel2);border-radius:10px;margin-top:7px;font-size:12px}
    .page{padding:22px;overflow:auto;width:100%}.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:10px}.page-head h2{margin:0;font-size:20px}.date-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.date-controls input{border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff}.surface{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 3px 12px rgba(24,33,47,.03)}
    .schedule-state{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;padding:16px}.slot{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;min-height:92px}.slot.available{border-color:#b7e6d5;background:#f5fdf9}.slot.booked{border-color:#cfc3ff;background:#faf8ff}.slot.past{background:#f2f3f5;color:#8c94a0}.slot.clinic_closed{background:#fff6df;color:#90600c}.slot-time{font-weight:800;margin-bottom:7px}.slot-status{font-size:11px;text-transform:uppercase;color:var(--muted)}.slot-detail{font-size:11px;margin-top:6px;line-height:1.5}
    .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px;margin-bottom:18px}.metric{padding:17px}.metric .label{font-size:12px;color:var(--muted)}.metric .value{font-size:27px;font-weight:800;margin-top:6px}.metric .note{font-size:10px;color:var(--muted);margin-top:4px}.trend{padding:18px}.trend h3{margin:0 0 18px;font-size:15px}.chart{height:230px;display:flex;align-items:flex-end;gap:8px;border-bottom:1px solid var(--line);padding-top:20px}.bar-col{flex:1;min-width:22px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}.bar{width:min(28px,80%);background:linear-gradient(#8d73ec,#6847d8);border-radius:6px 6px 0 0;min-height:2px}.bar-label{font-size:9px;color:var(--muted);direction:ltr}
    .health-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.health-card{padding:17px}.health-title{display:flex;align-items:center;justify-content:space-between}.health-badge{padding:4px 8px;border-radius:10px;font-size:11px}.health-badge.healthy{background:var(--greenbg);color:var(--green)}.health-badge.degraded{background:var(--amberbg);color:var(--amber)}.health-badge.unavailable{background:var(--redbg);color:var(--red)}.health-badge.unknown{background:#eef1f6;color:#626d7c}.health-detail{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5}
    .notice{padding:12px 14px;border-radius:11px;margin:10px 0;font-size:12px}.notice.error{background:var(--redbg);color:var(--red)}.notice.warning{background:var(--amberbg);color:var(--amber)}.notice.success{background:var(--greenbg);color:var(--green)}.loader{width:20px;height:20px;border:2px solid #ddd;border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:fixed;bottom:20px;left:20px;z-index:100;background:#202534;color:#fff;padding:11px 15px;border-radius:11px;box-shadow:var(--shadow);max-width:350px}.toast.error{background:#9e2937}
    dialog{border:0;border-radius:16px;box-shadow:var(--shadow);padding:0;width:min(460px,calc(100% - 24px));color:var(--text)}dialog::backdrop{background:rgba(20,24,34,.46)}.modal-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.modal-head h3{margin:0}.modal-body{padding:18px}.modal-body label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}.modal-body input,.modal-body textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px}.modal-foot{padding:13px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
    @media(max-width:1180px){.inbox-shell{grid-template-columns:320px minmax(0,1fr)}.profile-pane{position:fixed;top:68px;bottom:0;inset-inline-end:0;width:min(360px,90vw);z-index:20;box-shadow:var(--shadow);transform:translateX(110%);transition:transform .15s}.profile-pane.open{transform:translateX(0)}[dir=rtl] .profile-pane{transform:translateX(-110%)}[dir=rtl] .profile-pane.open{transform:translateX(0)}}
    @media(max-width:760px){body{overflow:auto}.app{display:block}.sidebar{position:fixed;z-index:40;bottom:0;left:0;right:0;height:64px;padding:6px 8px;display:block}.logo,.sidebar-foot{display:none}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}.nav button{padding:7px 3px;display:grid;place-items:center;font-size:10px;text-align:center}.nav .icon{font-size:18px}.main{height:calc(100dvh - 64px)}.topbar{height:58px;flex-basis:58px;padding:0 14px}.inbox-shell{display:block}.patient-pane{height:100%}.chat-pane{position:fixed;inset:58px 0 64px;background:#fff;z-index:15;transform:translateX(105%);transition:transform .15s}.chat-pane.open{transform:translateX(0)}[dir=rtl] .chat-pane{transform:translateX(-105%)}[dir=rtl] .chat-pane.open{transform:translateX(0)}#backChat{display:grid!important}.chat-header{padding:8px}.quick-actions .btn{display:none}.message{max-width:88%}.profile-pane{top:58px;bottom:64px}.page{padding:14px}.page-head{align-items:flex-start;flex-direction:column}.metrics{grid-template-columns:1fr 1fr}.slot-grid{grid-template-columns:1fr 1fr;padding:10px}.topbar-actions .btn{display:none}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo"><div class="logo-mark">J</div><div><strong>Jothen</strong><small>Operations CRM</small></div></div>
    <nav class="nav">
      <button class="active" data-view="inbox"><span class="icon">◫</span><span data-i18n="inbox">المحادثات</span></button>
      <button data-view="appointments"><span class="icon">▦</span><span data-i18n="appointments">المواعيد</span></button>
      <button data-view="analytics"><span class="icon">⌁</span><span data-i18n="analytics">التحليلات</span></button>
      <button data-view="health"><span class="icon">◉</span><span data-i18n="health">حالة النظام</span></button>
    </nav>
    <div class="sidebar-foot">
      <button class="global-bot" id="globalBot"><span data-i18n="globalBot">الرد الآلي العام</span><strong>—</strong></button>
      <button class="lang" id="langBtn">English</button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <h1 id="pageTitle">المحادثات</h1>
      <div class="topbar-actions"><span class="status-dot" id="topHealth"></span><span id="clock"></span><button class="btn small" id="mobileLang">EN</button></div>
    </header>

    <section class="view active" id="view-inbox">
      <div class="inbox-shell">
        <aside class="patient-pane">
          <div class="pane-head"><div class="pane-title"><h2 data-i18n="inbox">المحادثات</h2><button class="btn icon-btn" id="refreshInbox">↻</button></div><div class="search"><input id="inboxSearch" data-placeholder="search" placeholder="بحث بالاسم أو الرقم"></div></div>
          <div class="filters" id="filters"></div>
          <div class="patient-list" id="patientList"><div class="empty"><div class="loader"></div></div></div>
        </aside>
        <section class="chat-pane" id="chatPane">
          <div class="empty" id="chatEmpty"><div><strong data-i18n="chooseChat">اختاري محادثة</strong><span data-i18n="chooseChatSub">لعرض الرسائل وبيانات المريضة</span></div></div>
          <div class="hidden" id="chatActive" style="height:100%;display:flex;flex-direction:column">
            <header class="chat-header">
              <div class="chat-person"><button class="btn icon-btn hidden" id="backChat">←</button><div class="avatar" id="chatAvatar">؟</div><div><h2 id="chatName">—</h2><div class="chat-sub"><span id="chatPhone"></span><span id="chatState"></span><span id="chatAppointment"></span></div></div></div>
              <div class="quick-actions" id="quickActions"></div>
            </header>
            <div class="messages" id="messages"></div>
            <form class="composer" id="composer"><textarea id="replyText" rows="1" data-placeholder="reply" placeholder="اكتبي رد الموظف..."></textarea><button class="btn primary" id="sendBtn" type="submit" data-i18n="send">إرسال</button></form>
          </div>
        </section>
        <aside class="profile-pane" id="profilePane"><div class="profile-content" id="profileContent"><div class="empty"><span data-i18n="noPatient">لا توجد مريضة محددة</span></div></div></aside>
      </div>
    </section>

    <section class="view" id="view-appointments">
      <div class="page">
        <div class="page-head"><div><h2 data-i18n="appointmentSchedule">جدول المواعيد</h2><div style="color:var(--muted);font-size:12px;margin-top:5px" data-i18n="authoritative">البيانات المباشرة من نظام Google Apps Script</div></div><div class="date-controls"><button class="btn" id="prevDay">‹</button><button class="btn" id="todayBtn" data-i18n="today">اليوم</button><input type="date" id="scheduleDate"><button class="btn" id="nextDay">›</button><button class="btn primary" id="refreshSchedule">↻ <span data-i18n="refresh">تحديث</span></button></div></div>
        <div class="surface" id="schedulePanel"><div class="empty"><div class="loader"></div></div></div>
      </div>
    </section>

    <section class="view" id="view-analytics">
      <div class="page"><div class="page-head"><h2 data-i18n="operationsSummary">ملخص العمليات</h2><button class="btn" id="refreshAnalytics">↻ <span data-i18n="refresh">تحديث</span></button></div><div class="metrics" id="metrics"></div><div class="surface trend"><h3 data-i18n="dailyActivity">النشاط اليومي</h3><div class="chart" id="chart"></div></div></div>
    </section>

    <section class="view" id="view-health">
      <div class="page"><div class="page-head"><div><h2 data-i18n="systemHealth">حالة النظام</h2><div style="color:var(--muted);font-size:12px;margin-top:5px" data-i18n="safeChecks">فحوصات آمنة بدون عرض أسرار أو إرسال رسائل للمرضى</div></div><button class="btn primary" id="refreshHealth">↻ <span data-i18n="checkNow">فحص الآن</span></button></div><div id="healthOverall"></div><div class="health-grid" id="healthGrid"></div></div>
    </section>
  </main>
</div>

<dialog id="actionDialog"><form method="dialog" id="actionForm"><div class="modal-head"><h3 id="dialogTitle"></h3><button class="btn icon-btn" value="cancel" type="submit">×</button></div><div class="modal-body" id="dialogBody"></div><div class="modal-foot"><button class="btn" value="cancel" type="submit" data-i18n="cancelAction">إلغاء</button><button class="btn primary" value="confirm" id="dialogConfirm" type="submit" data-i18n="confirm">تأكيد</button></div></form></dialog>
<div class="toast hidden" id="toast"></div>

<script>
(function(){
  "use strict";
  var AR={

  async function loadSchedule(){q("scheduleDate").value=state.scheduleDate;q("schedulePanel").innerHTML='<div class="empty"><div class="loader"></div></div>';try{var r=await api("/admin/api/schedule?date="+state.scheduleDate);var d=r.data;var legend='<div class="schedule-state"><strong>'+esc(d.date)+'</strong><span>'+esc(d.state)+"</span></div>";var slots=(d.slots||[]).map(function(s){var detail="";if(s.appointment){var a=s.appointment;detail=typeof a==="string"?a:[a.patient_name||a.name,a.phone||a.phone_number,a.area||a.service].filter(Boolean).map(esc).join("<br>")}return '<div class="slot '+esc(s.status)+'"><div class="slot-time">'+esc(s.time)+'</div><div class="slot-status">'+esc(tr(s.status))+'</div><div class="slot-detail">'+detail+"</div>"+(s.status==="available"?'<button class="btn small" data-slot="'+esc(s.time)+'">'+esc(tr("book"))+"</button>":"")+"</div>"}).join("");q("schedulePanel").innerHTML=legend+'<div class="slot-grid">'+slots+"</div>";q("schedulePanel").querySelectorAll("[data-slot]").forEach(function(b){b.onclick=function(){if(!state.selected){toast(tr("chooseChat"),true);return}openBook(state.scheduleDate,b.dataset.slot)}})}catch(e){q("schedulePanel").innerHTML='<div class="empty"><div class="notice error">'+esc(e.message)+"</div></div>"}}

  async function loadHealth(){q("healthGrid").innerHTML='<div class="loader"></div>';try{var r=await api("/admin/api/system-health"),d=r.data;q("topHealth").className="status-dot "+d.overall;q("healthOverall").innerHTML='<div class="notice '+(d.overall==="healthy"?"success":"warning")+'">'+esc(tr(d.overall))+" • "+esc(fmtDate(d.checked_at,true))+"</div>";q("healthGrid").innerHTML=Object.keys(d.components).map(function(k){var c=d.components[k];return '<div class="surface health-card"><div class="health-title"><strong>'+esc(k.replace("_"," "))+'</strong><span class="health-badge '+esc(c.status)+'">'+esc(tr(c.status))+'</span></div><div class="health-detail">'+esc(c.detail||"")+"</div></div>"}).join("");var gb=d.components.global_bot;q("globalBot").querySelector("strong").textContent=gb.active?tr("globalOn"):tr("globalOff")}catch(e){q("healthGrid").innerHTML='<div class="notice error">'+esc(e.message)+"</div>"}}
  async function toggleGlobal(){try{var current=q("globalBot").querySelector("strong").textContent===tr("globalOn");await post("/admin/api/toggle_global_bot",{is_active:!current});loadHealth()}catch(e){toast(e.message,true)}}
  document.querySelectorAll(".nav button").forEach(function(b){b.onclick=function(){changeView(b.dataset.view)}});q("langBtn").onclick=function(){setLanguage(state.lang==="ar"?"en":"ar")};q("mobileLang").onclick=q("langBtn").onclick;q("refreshInbox").onclick=function(){loadInbox(true)};q("inboxSearch").oninput=function(){clearTimeout(this._timer);var self=this;this._timer=setTimeout(function(){state.search=self.value.trim();loadInbox(true)},300)};q("composer").onsubmit=sendReply;q("backChat").onclick=function(){q("chatPane").classList.remove("open")};q("prevDay").onclick=function(){changeDay(-1)};q("nextDay").onclick=function(){changeDay(1)};q("todayBtn").onclick=function(){state.scheduleDate=todayISO();loadSchedule()};q("scheduleDate").onchange=function(){state.scheduleDate=this.value;loadSchedule()};q("refreshSchedule").onclick=loadSchedule;q("refreshAnalytics").onclick=loadAnalytics;q("refreshHealth").onclick=loadHealth;q("globalBot").onclick=toggleGlobal;
  setInterval(function(){q("clock").textContent=new Intl.DateTimeFormat(state.lang==="ar"?"ar-EG":"en-GB",{timeZone:"Africa/Cairo",hour:"2-digit",minute:"2-digit"}).format(new Date())},1000);
  setLanguage(state.lang);renderFilters();loadInbox(true);loadHealth();state.poll=setInterval(pollInbox,8000);
})();
</script>
