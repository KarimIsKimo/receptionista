<!doctype html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jothen Clinics — Admin</title>
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--soft:#f4f6f8;--line:#e5e7eb;--text:#111827;--muted:#6b7280;
  --brand:#0f766e;--brand2:#0d9488;--brandSoft:#ecfdf5;--danger:#dc2626;--dangerSoft:#fef2f2;
  --warn:#d97706;--blue:#2563eb;--bubble:#dcfce7;--staff:#dbeafe;--shadow:0 14px 38px rgba(15,23,42,.12)
}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,Segoe UI,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.app{height:100%;display:grid;grid-template-rows:56px minmax(0,1fr)}
.topbar{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 14px;z-index:30}
.brand{font-weight:850;display:flex;align-items:center;gap:9px;white-space:nowrap}.brandmark{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center}
.nav{display:flex;align-items:center;gap:4px;margin-inline:auto}.navbtn,.iconbtn,.btn{border:1px solid transparent;background:transparent;color:var(--text);border-radius:9px;min-height:36px;padding:7px 11px;font-weight:700}.navbtn:hover,.iconbtn:hover,.btn:hover{background:var(--soft)}.navbtn.active{background:#eef8f6;color:var(--brand)}
.top-actions{display:flex;align-items:center;gap:7px}.status-pill{display:flex;align-items:center;gap:7px;border:1px solid var(--line);padding:7px 10px;border-radius:999px;background:#fff;font-size:12px;font-weight:800}.status-pill.on{color:#166534;background:#f0fdf4;border-color:#bbf7d0}.status-pill.off{color:#991b1b;background:#fef2f2;border-color:#fecaca}.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.workspace{min-height:0;overflow:hidden}.view{display:none;height:100%}.view.active{display:block}
.chat-shell{height:100%;display:grid;grid-template-columns:320px minmax(0,1fr);direction:ltr;background:#fff}
.sidebar{direction:var(--dir);min-width:0;border-right:1px solid var(--line);display:grid;grid-template-rows:auto auto minmax(0,1fr);background:#fff}
.sidebar-tools{padding:12px 12px 8px;display:flex;gap:8px}.searchwrap{flex:1;position:relative}.searchwrap input{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#f9fafb;outline:none}.searchwrap input:focus{background:#fff;border-color:#99f6e4;box-shadow:0 0 0 3px rgba(13,148,136,.08)}
.filters{display:flex;gap:6px;padding:0 12px 9px;border-bottom:1px solid var(--line);overflow:auto}.filter{border:1px solid var(--line);background:#fff;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:750;white-space:nowrap}.filter.active{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
.patient-list{overflow:auto;min-height:0;overscroll-behavior:contain}.patient{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:9px;padding:11px 12px;border-bottom:1px solid #f0f2f4;align-items:center;cursor:pointer;position:relative}.patient:hover{background:#f8fafc}.patient.active{background:#effcf8}.avatar{width:42px;height:42px;border-radius:50%;background:#e6fffb;color:#0f766e;display:grid;place-items:center;font-weight:900;font-size:15px}.patient-main{min-width:0}.patient-name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.patient-preview{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.patient-meta{font-size:10px;color:var(--muted);text-align:end;white-space:nowrap}.patient-badges{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}.chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:3px 6px;border-radius:999px;background:#f3f4f6;color:#4b5563}.chip.pause{background:#fff1f2;color:#be123c}.chip.tag{background:#eff6ff;color:#1d4ed8}.unread{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--brand2);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:900;margin-top:5px;margin-inline-start:auto}
.chat-pane{direction:var(--dir);min-width:0;display:grid;grid-template-rows:58px minmax(0,1fr) auto;background:#f5f1eb;position:relative}
.chat-header{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:10px;z-index:5}.chat-title{min-width:0}.chat-name{font-size:15px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-sub{font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:7px;align-items:center}.header-actions{display:flex;gap:5px;align-items:center}.header-actions .btn{border-color:var(--line);background:#fff;padding:7px 9px}.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.danger{background:var(--dangerSoft);color:#b91c1c;border-color:#fecaca}.btn.success{background:#f0fdf4;color:#166534;border-color:#bbf7d0}.btn.sm{min-height:32px;padding:5px 8px;font-size:12px}
.messages-wrap{min-height:0;position:relative;overflow:hidden}.messages{height:100%;overflow-y:auto;overflow-x:hidden;padding:20px clamp(14px,3vw,34px) 18px;display:flex;flex-direction:column;gap:6px;overscroll-behavior:contain;scrollbar-gutter:stable}.messages:before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(15,118,110,.035) 1px,transparent 1px);background-size:18px 18px}
.day{align-self:center;background:rgba(255,255,255,.9);border:1px solid #ece7df;border-radius:999px;padding:5px 10px;font-size:10px;color:#6b7280;box-shadow:0 1px 2px rgba(0,0,0,.04);z-index:1}.msg{z-index:1;max-width:min(72%,720px);padding:8px 10px 6px;border-radius:12px;box-shadow:0 1px 1px rgba(0,0,0,.07);white-space:pre-wrap;word-break:break-word;position:relative;line-height:1.45;font-size:14px}.msg.user{align-self:flex-start;background:#fff;border-top-left-radius:4px}.msg.model{align-self:flex-end;background:var(--bubble);border-top-right-radius:4px}.msg.staff{align-self:flex-end;background:var(--staff);border-top-right-radius:4px}.msg.system{align-self:center;background:#fff7ed;color:#9a3412;font-size:12px;max-width:88%}.msgmeta{font-size:9px;color:#6b7280;margin-top:4px;display:flex;justify-content:flex-end;gap:5px;direction:ltr}.copybtn{position:absolute;top:4px;inset-inline-end:4px;border:0;background:rgba(255,255,255,.9);border-radius:7px;padding:2px 5px;font-size:9px;opacity:0}.msg:hover .copybtn{opacity:1}.load-older{align-self:center;border:1px solid #ddd6ce;background:#fff;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:700;z-index:2}.jump{position:absolute;right:20px;bottom:16px;border:1px solid var(--line);background:#fff;width:40px;height:40px;border-radius:50%;box-shadow:var(--shadow);display:none;place-items:center;z-index:6}.jump.show{display:grid}.jump .count{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:999px;background:var(--brand2);color:#fff;font-size:9px;display:grid;place-items:center;padding:0 4px}
.emptychat{margin:auto;text-align:center;color:var(--muted);z-index:2}.emptychat .big{font-size:38px;margin-bottom:8px}
.composer{background:#fff;border-top:1px solid var(--line);padding:8px 10px}.quickbar{display:flex;gap:6px;overflow:auto;padding-bottom:7px}.quickbar button{border:1px solid var(--line);background:#f8fafc;border-radius:999px;padding:5px 8px;font-size:11px;white-space:nowrap}.compose-row{display:flex;gap:8px;align-items:flex-end}.compose-row textarea{flex:1;min-height:42px;max-height:120px;resize:none;border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;line-height:1.35}.compose-row textarea:focus{border-color:#99f6e4;box-shadow:0 0 0 3px rgba(13,148,136,.08)}.sendbtn{height:42px;min-width:46px;border:0;border-radius:12px;background:var(--brand);color:#fff;font-weight:900;padding:0 14px}
.drawer-backdrop{position:fixed;inset:56px 0 0;background:rgba(15,23,42,.24);display:none;z-index:40}.drawer-backdrop.open{display:block}.drawer{position:fixed;top:56px;bottom:0;right:0;width:min(390px,94vw);background:#fff;z-index:41;transform:translateX(102%);transition:.2s ease;box-shadow:-12px 0 30px rgba(15,23,42,.12);display:grid;grid-template-rows:58px minmax(0,1fr)}[dir="rtl"] .drawer{right:auto;left:0;transform:translateX(-102%);box-shadow:12px 0 30px rgba(15,23,42,.12)}.drawer.open{transform:none}.drawer-head{border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-weight:850}.drawer-body{overflow:auto;padding:14px}.card{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}.card h4{margin:0 0 9px;font-size:13px}.kv{display:grid;grid-template-columns:90px 1fr;gap:6px;font-size:12px;margin:5px 0}.kv b{color:#6b7280}.card textarea,.card input{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;outline:none}.card textarea{min-height:120px;resize:vertical}.drawer-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.drawer-actions .wide{grid-column:1/-1}
.panel-view{height:100%;overflow:auto;padding:16px}.panel{max-width:1500px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:14px;min-height:100%;padding:16px}.panel-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.panel-head h2{margin:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:9px;padding:8px 10px}.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px}.slot{border:1px solid var(--line);border-radius:11px;padding:12px;background:#fafafa}.slot.free{background:#f0fdf4;border-color:#bbf7d0}.slot.booked{background:#fff7ed;border-color:#fed7aa}.slot .time{font-size:17px;font-weight:900;margin-bottom:3px}.analytics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.metric{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}.metric .label{font-size:11px;color:var(--muted)}.metric .value{font-size:27px;font-weight:900;margin-top:4px}.audit{margin-top:16px}.audit-row{padding:9px 0;border-bottom:1px solid #f0f2f4;font-size:12px}.muted{color:var(--muted);font-size:11px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:18px}.modal.open{display:flex}.modalbox{width:min(900px,96vw);max-height:90vh;background:#fff;border-radius:14px;padding:16px;display:grid;gap:10px}.modalbox textarea{min-height:50vh;border:1px solid var(--line);border-radius:10px;padding:10px}.toast{position:fixed;bottom:18px;right:18px;background:#111827;color:#fff;padding:9px 12px;border-radius:9px;z-index:100;opacity:0;transform:translateY(8px);transition:.2s;font-size:12px}.toast.show{opacity:1;transform:none}
.mobile-only{display:none}
@media(max-width:900px){.brand span{display:none}.navbtn span{display:none}.status-pill .label{display:none}.chat-shell{grid-template-columns:290px minmax(0,1fr)}.msg{max-width:82%}}
@media(max-width:700px){.topbar{padding:0 8px}.nav{margin-inline:0}.top-actions{margin-inline-start:auto}.chat-shell{grid-template-columns:1fr;position:relative}.sidebar{position:absolute;inset:0 24% 0 0;z-index:20;box-shadow:10px 0 24px rgba(15,23,42,.13)}[dir="rtl"] .sidebar{inset:0 0 0 24%;box-shadow:-10px 0 24px rgba(15,23,42,.13)}.sidebar.mobile-hidden{display:none}.mobile-only{display:inline-flex}.chat-header .desktop-secondary{display:none}.msg{max-width:88%}.panel-view{padding:8px}.drawer{top:56px;width:100vw}.drawer-backdrop{top:56px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brandmark">J</div><span>Jothen Clinics</span></div>
    <nav class="nav">
      <button class="navbtn active" data-view="chats" onclick="switchView('chats',this)">💬 <span data-i18n="chats">Chats</span></button>
      <button class="navbtn" data-view="schedule" onclick="switchView('schedule',this)">📅 <span data-i18n="appointments">Appointments</span></button>
      <button class="navbtn" data-view="stats" onclick="switchView('stats',this)">📊 <span data-i18n="analytics">Analytics</span></button>
    </nav>
    <div class="top-actions">
      <button id="globalBot" class="status-pill" onclick="toggleGlobal()"><span class="dot"></span><span class="label">Bot</span></button>
      <button class="iconbtn" id="langBtn" onclick="toggleLanguage()" title="Language">EN</button>
      <button class="iconbtn" onclick="openSettings()" title="Settings">⚙️</button>
    </div>
  </header>

  <main class="workspace">
    <section id="chats" class="view active">
      <div class="chat-shell">
        <aside class="sidebar" id="sidebar">
          <div class="sidebar-tools">
            <div class="searchwrap"><input id="search" data-i18n-placeholder="search" placeholder="Search patients..." oninput="debouncedLoadPatients()"></div>
            <button class="iconbtn" onclick="loadPatients(true)" title="Refresh">↻</button>
          </div>
          <div class="filters">
            <button class="filter active" onclick="setFilter('all',this)" data-i18n="all">All</button>
            <button class="filter" onclick="setFilter('paused',this)" data-i18n="takeovers">Takeovers</button>
            <button class="filter" onclick="setFilter('active',this)" data-i18n="active">Bot active</button>
          </div>
          <div class="patient-list" id="patients"></div>
        </aside>

        <section class="chat-pane">
          <div class="chat-header">
            <div style="display:flex;gap:8px;align-items:center;min-width:0">
              <button class="iconbtn mobile-only" onclick="openSidebar()">☰</button>
              <div class="chat-title" id="chatTitle"><div class="chat-name" data-i18n="selectChat">Select a conversation</div><div class="chat-sub" data-i18n="selectHint">Choose a patient from the list</div></div>
            </div>
            <div class="header-actions" id="chatActions" style="display:none">
              <button class="btn sm desktop-secondary" onclick="renamePatient()">✏️ <span data-i18n="rename">Rename</span></button>
              <button id="pauseBtn" class="btn sm" onclick="togglePause()"></button>
              <button class="btn sm" onclick="openDrawer()">👤 <span class="desktop-secondary" data-i18n="details">Details</span></button>
            </div>
          </div>
          <div class="messages-wrap">
            <div class="messages" id="messages"><div class="emptychat"><div class="big">💬</div><div data-i18n="selectChat">Select a conversation</div></div></div>
            <button class="jump" id="jumpBtn" onclick="scrollToBottom(true)">↓<span class="count hidden" id="newCount">0</span></button>
          </div>
          <div class="composer" id="composer" style="display:none">
            <div class="quickbar">
              <button onclick="useQuick('مرحبا! كيف يمكننا مساعدتك؟')">👋 Greeting</button>
              <button onclick="useQuick('تم استلام رسالتك، وسيتواصل معك فريق العيادة قريباً.')">📩 Received</button>
              <button onclick="useQuick('يمكننا مساعدتك في حجز موعد مناسب. ما اليوم المناسب لك؟')">📅 Booking</button>
            </div>
            <div class="compose-row">
              <textarea id="reply" rows="1" data-i18n-placeholder="reply" placeholder="Type a reply..." onkeydown="composerKeydown(event)" oninput="autoGrow(this)"></textarea>
              <button class="sendbtn" onclick="sendStaff()">➤</button>
            </div>
          </div>
        </section>
      </div>
    </section>

    <section id="schedule" class="view panel-view">
      <div class="panel">
        <div class="panel-head"><h2 data-i18n="appointments">Appointments</h2><div class="toolbar"><input id="date" type="date" onchange="loadSchedule()"><button class="btn" onclick="loadSchedule()">↻ <span data-i18n="refresh">Refresh</span></button></div></div>
        <div id="slots" class="slots"></div>
      </div>
    </section>

    <section id="stats" class="view panel-view">
      <div class="panel">
        <div class="panel-head"><h2 data-i18n="analytics">Analytics</h2><button class="btn" onclick="loadStats()">↻ <span data-i18n="refresh">Refresh</span></button></div>
        <div id="statsGrid" class="analytics-grid"></div>
        <div class="audit"><h3 data-i18n="activity">Recent activity</h3><div id="audit"></div></div>
      </div>
    </section>
  </main>
</div>

<div class="drawer-backdrop" id="drawerBackdrop" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head"><span data-i18n="details">Patient details</span><button class="iconbtn" onclick="closeDrawer()">✕</button></div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<div class="modal" id="settingsModal"><div class="modalbox"><h3 style="margin:0" data-i18n="botInstructions">Bot instructions</h3><textarea id="instruction"></textarea><div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn" onclick="closeSettings()" data-i18n="cancel">Cancel</button><button class="btn primary" onclick="saveSettings()" data-i18n="save">Save</button></div></div></div>
<div class="toast" id="toast"></div>

<script>
const I18N={
 en:{chats:'Chats',appointments:'Appointments',analytics:'Analytics',search:'Search patients...',all:'All',takeovers:'Takeovers',active:'Bot active',selectChat:'Select a conversation',selectHint:'Choose a patient from the list',reply:'Type a manual reply...',rename:'Rename',details:'Details',refresh:'Refresh',activity:'Recent activity',botInstructions:'Bot instructions',cancel:'Cancel',save:'Save',newPatient:'New patient',human:'Human takeover',resume:'Resume bot',pause:'Pause bot',sendConfirm:'Send this message and pause the bot for this patient?',saved:'Saved',loading:'Loading...',noMessages:'No messages',phone:'Phone',status:'Bot status',created:'Created',updated:'Updated',notes:'Notes / preferences',tags:'Tags',noTags:'No tags',copy:'Copy',copied:'Copied',older:'Load older messages',noOlder:'No older messages',botRunning:'Bot running',botStopped:'Bot stopped',patients:'Patients',messages:'Messages',incoming:'Incoming 24h',staff:'Staff replies 24h',takeoversMetric:'Human takeovers',settingsShort:'Instructions are too short'},
 ar:{chats:'المحادثات',appointments:'المواعيد',analytics:'الإحصائيات',search:'بحث بالاسم أو رقم الهاتف...',all:'الكل',takeovers:'تدخل بشري',active:'البوت يعمل',selectChat:'اختر محادثة',selectHint:'اختر مريضاً من القائمة',reply:'اكتب رداً يدوياً...',rename:'تعديل الاسم',details:'التفاصيل',refresh:'تحديث',activity:'آخر النشاطات',botInstructions:'تعليمات البوت',cancel:'إلغاء',save:'حفظ',newPatient:'مريض جديد',human:'تدخل بشري',resume:'تشغيل البوت',pause:'إيقاف البوت',sendConfirm:'إرسال الرسالة وإيقاف البوت لهذا المريض؟',saved:'تم الحفظ',loading:'جاري التحميل...',noMessages:'لا توجد رسائل',phone:'الهاتف',status:'حالة البوت',created:'تاريخ الإنشاء',updated:'آخر تحديث',notes:'ملاحظات / تفضيلات',tags:'الوسوم',noTags:'لا توجد وسوم',copy:'نسخ',copied:'تم النسخ',older:'تحميل رسائل أقدم',noOlder:'لا توجد رسائل أقدم',botRunning:'البوت يعمل',botStopped:'البوت متوقف',patients:'المرضى',messages:'الرسائل',incoming:'رسائل 24 ساعة',staff:'ردود الموظفين 24 ساعة',takeoversMetric:'التدخل البشري',settingsShort:'التعليمات قصيرة جداً'}
};
let currentLang=localStorage.getItem('jothen_admin_lang')||'en';
let patients=[],currentPhone=null,currentPatient=null,currentMessages=[],hasMore=false,oldestId=null,latestId=null,filter='all',loadingOlder=false,unseenNew=0,patientTimer=null;
const t=k=>I18N[currentLang]?.[k]||k;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const fmt=x=>{if(!x)return'';const d=new Date(x);return isNaN(d)?'':d.toLocaleString(currentLang==='ar'?'ar-EG':'en-GB',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})};
const initials=n=>{const s=(n||'').trim();if(!s)return'J';return s.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()};
function applyLanguage(){const root=document.getElementById('htmlRoot');root.lang=currentLang;root.dir=currentLang==='ar'?'rtl':'ltr';document.documentElement.style.setProperty('--dir',root.dir);document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));document.querySelectorAll('[data-i18n-placeholder]').forEach(e=>e.placeholder=t(e.dataset.i18nPlaceholder));document.getElementById('langBtn').textContent=currentLang==='ar'?'EN':'AR';renderPatients();if(currentPatient){renderChat(false);renderDrawer();updatePause()}}
function toggleLanguage(){currentLang=currentLang==='ar'?'en':'ar';localStorage.setItem('jothen_admin_lang',currentLang);applyLanguage()}
async function api(url,opt={}){const r=await fetch(url,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||'Request failed');return j}
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.classList.remove('show'),1800)}
function switchView(id,btn){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.navbtn').forEach(v=>v.classList.remove('active'));btn?.classList.add('active');if(id==='schedule')loadSchedule();if(id==='stats')loadStats()}
function setFilter(f,btn){filter=f;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));btn.classList.add('active');loadPatients(true)}
function debouncedLoadPatients(){clearTimeout(patientTimer);patientTimer=setTimeout(()=>loadPatients(true),220)}
function seenKey(phone){return 'jothen_seen_'+phone}function getSeen(phone){return Number(localStorage.getItem(seenKey(phone))||0)}function markSeen(phone,id){if(phone&&id)localStorage.setItem(seenKey(phone),String(id))}
async function loadPatients(){try{const q=encodeURIComponent(document.getElementById('search').value||'');let url='/admin/api/data?search='+q+'&limit=300&include_chats=false';if(filter==='paused')url+='&paused=true';if(filter==='active')url+='&paused=false';const d=await api(url);patients=d.patients||[];renderPatients();if(!currentPhone&&patients[0])selectPatient(patients[0],true);else if(currentPhone){const p=patients.find(x=>x.phone_number===currentPhone);if(p){currentPatient={...currentPatient,...p};updateHeader();updatePause();renderDrawer()}}}catch(e){console.error(e)}}
function renderPatients(){const box=document.getElementById('patients');if(!box)return;const keep=box.scrollTop;box.innerHTML='';if(!patients.length){box.innerHTML=`<div style="padding:20px;text-align:center;color:#6b7280">${t('noMessages')}</div>`;return}for(const p of patients){const seen=getSeen(p.phone_number), unread=Math.max(0,Number(p.last_msg_id||0)-seen);const el=document.createElement('div');el.className='patient'+(p.phone_number===currentPhone?' active':'');const badges=[p.is_paused?`<span class="chip pause">⏸ ${t('human')}</span>`:'',...(p.tags||[]).slice(0,2).map(x=>`<span class="chip tag">${esc(x)}</span>`)].join('');el.innerHTML=`<div class="avatar">${esc(initials(p.name||t('newPatient')))}</div><div class="patient-main"><div class="patient-name">${esc(p.name||t('newPatient'))}</div><div class="patient-preview">${esc(p.last_message||t('noMessages'))}</div><div class="patient-badges">${badges}</div></div><div class="patient-meta"><div>${fmt(p.last_msg_time)}</div>${unread>0&&p.phone_number!==currentPhone?`<div class="unread">${unread>99?'99+':unread}</div>`:''}</div>`;el.onclick=()=>selectPatient(p,true);box.appendChild(el)}box.scrollTop=keep}
function selectPatient(p,reset=true){currentPhone=p.phone_number;currentPatient=p;unseenNew=0;document.getElementById('chatActions').style.display='flex';document.getElementById('composer').style.display='block';updateHeader();updatePause();renderPatients();loadChat(reset);closeSidebar()}
function updateHeader(){if(!currentPatient)return;document.getElementById('chatTitle').innerHTML=`<div class="chat-name">${esc(currentPatient.name||t('newPatient'))}</div><div class="chat-sub"><span dir="ltr">${esc(currentPatient.phone_number)}</span>${currentPatient.is_paused?`<span class="chip pause">⏸ ${t('human')}</span>`:''}</div>`}
function updatePause(){const b=document.getElementById('pauseBtn');if(!b||!currentPatient)return;b.className='btn sm '+(currentPatient.is_paused?'success':'danger');b.textContent=(currentPatient.is_paused?'▶ ':'⏸ ')+(currentPatient.is_paused?t('resume'):t('pause'))}
async function loadChat(reset=false){if(!currentPhone)return;const box=document.getElementById('messages');try{if(reset){box.innerHTML=`<div class="emptychat">${t('loading')}</div>`;const d=await api('/admin/api/patient/'+encodeURIComponent(currentPhone)+'?limit=80');currentMessages=d.messages||[];currentPatient={...currentPatient,...(d.patient||{})};hasMore=!!d.has_more;oldestId=currentMessages[0]?.id||null;latestId=currentMessages.at(-1)?.id||null;renderChat(false);requestAnimationFrame(()=>scrollToBottom(true));markSeen(currentPhone,latestId);renderPatients();updateHeader();renderDrawer();return}
if(!latestId)return;const d=await api('/admin/api/patient/'+encodeURIComponent(currentPhone)+'?after_id='+latestId+'&limit=100');const incoming=d.messages||[];if(!incoming.length)return;const near=isNearBottom();currentMessages.push(...incoming);latestId=currentMessages.at(-1)?.id||latestId;renderChat(true);if(near){requestAnimationFrame(()=>scrollToBottom(true));markSeen(currentPhone,latestId);unseenNew=0}else{unseenNew+=incoming.length;showJump()}loadPatients()}catch(e){console.error(e)}}
async function loadOlder(){if(!hasMore||!oldestId||loadingOlder)return;loadingOlder=true;const box=document.getElementById('messages'),oldHeight=box.scrollHeight,oldTop=box.scrollTop;try{const d=await api('/admin/api/patient/'+encodeURIComponent(currentPhone)+'?before_id='+oldestId+'&limit=80');const incoming=d.messages||[];const known=new Set(currentMessages.map(m=>m.id));const older=incoming.filter(m=>!known.has(m.id));currentMessages=[...older,...currentMessages];hasMore=!!d.has_more;oldestId=currentMessages[0]?.id||oldestId;renderChat(false);requestAnimationFrame(()=>{box.scrollTop=box.scrollHeight-oldHeight+oldTop})}finally{loadingOlder=false}}
function sameDay(a,b){if(!a||!b)return false;const x=new Date(a),y=new Date(b);return x.getFullYear()===y.getFullYear()&&x.getMonth()===y.getMonth()&&x.getDate()===y.getDate()}
function renderChat(preserve=true){const box=document.getElementById('messages');const oldTop=box.scrollTop,oldHeight=box.scrollHeight;if(!currentMessages.length){box.innerHTML=`<div class="emptychat"><div class="big">💬</div><div>${t('noMessages')}</div></div>`;return}let html=hasMore?`<button class="load-older" onclick="loadOlder()">↑ ${t('older')}</button>`:'';let prev=null;for(const m of currentMessages){if(!sameDay(prev,m.created_at)){const d=new Date(m.created_at);html+=`<div class="day">${d.toLocaleDateString(currentLang==='ar'?'ar-EG':'en-GB',{weekday:'short',month:'short',day:'numeric'})}</div>`}html+=`<div class="msg ${esc(m.role)}" data-id="${m.id}">${esc(m.content)}<button class="copybtn" onclick='copyMsg(event,${JSON.stringify(String(m.content))})'>${t('copy')}</button><div class="msgmeta">${fmt(m.created_at)}</div></div>`;prev=m.created_at}box.innerHTML=html;if(preserve)box.scrollTop=oldTop+(box.scrollHeight-oldHeight)}
function copyMsg(e,s){e.stopPropagation();navigator.clipboard?.writeText(s).then(()=>toast(t('copied')))}
function isNearBottom(){const b=document.getElementById('messages');return b.scrollHeight-b.scrollTop-b.clientHeight<120}
function showJump(){const j=document.getElementById('jumpBtn'),c=document.getElementById('newCount');j.classList.add('show');if(unseenNew>0){c.textContent=unseenNew;c.classList.remove('hidden')}else c.classList.add('hidden')}
function scrollToBottom(mark=true){const b=document.getElementById('messages');b.scrollTop=b.scrollHeight;document.getElementById('jumpBtn').classList.remove('show');unseenNew=0;if(mark&&currentPhone&&latestId){markSeen(currentPhone,latestId);renderPatients()}}
async function togglePause(){if(!currentPhone)return;const next=!currentPatient.is_paused;await api('/admin/api/toggle_pause',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone_number:currentPhone,is_paused:next})});currentPatient.is_paused=next;updateHeader();updatePause();renderDrawer();loadPatients();toast(t('saved'))}
async function renamePatient(){if(!currentPhone)return;const n=prompt(t('rename'),currentPatient.name||'');if(!n)return;await api('/admin/api/rename_patient',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone_number:currentPhone,name:n})});currentPatient.name=n;updateHeader();renderDrawer();loadPatients();toast(t('saved'))}
async function sendStaff(){const box=document.getElementById('reply'),msg=box.value.trim();if(!currentPhone||!msg)return;if(!confirm(t('sendConfirm')))return;const btn=document.querySelector('.sendbtn');btn.disabled=true;try{await api('/admin/api/send_message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone_number:currentPhone,message:msg,pause_after_send:true})});box.value='';box.style.height='42px';currentPatient.is_paused=true;await loadChat(false);updateHeader();updatePause();renderDrawer()}catch(e){toast(e.message)}finally{btn.disabled=false}}
function composerKeydown(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendStaff()}}
function autoGrow(el){el.style.height='42px';el.style.height=Math.min(el.scrollHeight,120)+'px'}function useQuick(s){const e=document.getElementById('reply');e.value=s;autoGrow(e);e.focus()}
function openDrawer(){if(!currentPatient)return;renderDrawer();document.getElementById('drawer').classList.add('open');document.getElementById('drawerBackdrop').classList.add('open')}function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('drawerBackdrop').classList.remove('open')}
function renderDrawer(){const b=document.getElementById('drawerBody');if(!currentPatient){b.innerHTML='';return}const tags=(currentPatient.tags||[]).map(x=>`<span class="chip tag">${esc(x)}</span>`).join('')||`<span class="muted">${t('noTags')}</span>`;b.innerHTML=`<div class="card"><h4>${esc(currentPatient.name||t('newPatient'))}</h4><div class="kv"><b>${t('phone')}</b><span dir="ltr">${esc(currentPatient.phone_number)}</span></div><div class="kv"><b>${t('status')}</b><span>${currentPatient.is_paused?'🔴 '+t('human'):'🟢 '+t('botRunning')}</span></div><div class="kv"><b>${t('created')}</b><span>${fmt(currentPatient.created_at)}</span></div><div class="kv"><b>${t('updated')}</b><span>${fmt(currentPatient.updated_at)}</span></div></div><div class="card"><h4>${t('notes')}</h4><textarea id="prefsInput">${esc(currentPatient.preferences||'')}</textarea><button class="btn primary" style="width:100%;margin-top:7px" onclick="savePreferences()">💾 ${t('save')}</button></div><div class="card"><h4>${t('tags')}</h4><div style="display:flex;gap:5px;flex-wrap:wrap">${tags}</div><button class="btn" style="width:100%;margin-top:7px" onclick="editTags()">✏️ ${t('tags')}</button></div><div class="drawer-actions"><button class="btn" onclick="renamePatient()">✏️ ${t('rename')}</button><button class="btn" onclick="togglePause()">⏯ ${currentPatient.is_paused?t('resume'):t('pause')}</button><button class="btn wide" onclick="loadChat(true)">↻ ${t('refresh')}</button></div>`}
async function savePreferences(){const v=document.getElementById('prefsInput')?.value??'';await api('/admin/api/patient_preferences',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone_number:currentPhone,preferences:v})});currentPatient.preferences=v;toast(t('saved'))}
async function editTags(){const old=(currentPatient.tags||[]).join(', ');const s=prompt(t('tags'),old);if(s===null)return;const tags=s.split(',').map(x=>x.trim()).filter(Boolean);await api('/admin/api/patient_tags',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone_number:currentPhone,tags})});currentPatient.tags=tags;renderDrawer();loadPatients();toast(t('saved'))}
function openSidebar(){document.getElementById('sidebar').classList.remove('mobile-hidden')}function closeSidebar(){if(innerWidth<=700)document.getElementById('sidebar').classList.add('mobile-hidden')}
async function updateGlobal(){try{const s=await api('/admin/api/bot_status');const b=document.getElementById('globalBot');b.className='status-pill '+(s.is_active?'on':'off');b.innerHTML=`<span class="dot"></span><span class="label">${s.is_active?t('botRunning'):t('botStopped')}</span>`}catch(e){}}
async function toggleGlobal(){const s=await api('/admin/api/bot_status');const next=!s.is_active;if(!confirm(next?t('botRunning')+'?':t('botStopped')+'?'))return;await api('/admin/api/toggle_global_bot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({is_active:next})});updateGlobal()}
async function loadSchedule(){const d=document.getElementById('date');if(!d.value)d.value=new Date().toISOString().slice(0,10);const box=document.getElementById('slots');box.innerHTML=`<div class="muted">${t('loading')}</div>`;try{const data=await api('/admin/api/schedule?date='+d.value);const booked={};for(const x of data.booked||[]){const tm=typeof x==='string'?x:x.time;booked[String(tm).toUpperCase()]=x}const times=[];for(let h=12;h<=22;h++){for(const m of [0,30]){if(h===22&&m===30)continue;const hh=h>12?h-12:h,ap=h>=12?'PM':'AM';times.push(`${hh}:${m?'30':'00'} ${ap}`)}}box.innerHTML=times.map(tm=>{const x=booked[tm.toUpperCase()];return `<div class="slot ${x?'booked':'free'}"><div class="time">${tm}</div><div>${x?'🔴 Booked':'🟢 Available'}</div>${x?`<div class="muted" style="margin-top:6px">${esc(x.name||'')}<br>${esc(x.phone||'')}<br>${esc(x.area||'')}</div>`:''}</div>`}).join('')}catch(e){box.innerHTML=`<div style="color:#b91c1c">${esc(e.message)}</div>`}}
async function loadStats(){try{const s=await api('/admin/api/stats');const vals=[[t('patients'),s.patients],[t('messages'),s.messages],[t('incoming'),s.incoming_24h],[t('staff'),s.staff_24h],[t('takeoversMetric'),s.human_takeovers]];document.getElementById('statsGrid').innerHTML=vals.map(v=>`<div class="metric"><div class="label">${v[0]}</div><div class="value">${v[1]}</div></div>`).join('');const a=await api('/admin/api/audit?limit=100');document.getElementById('audit').innerHTML=(a.audit||[]).map(x=>`<div class="audit-row"><b>${esc(x.action)}</b> · ${esc(x.actor)} <span class="muted">${fmt(x.created_at)}</span><div class="muted">${esc(x.phone_number||'')} ${esc(x.details||'')}</div></div>`).join('')}catch(e){}}
async function openSettings(){try{const d=await api('/admin/api/settings');document.getElementById('instruction').value=d.instruction;document.getElementById('settingsModal').classList.add('open')}catch(e){toast(e.message)}}function closeSettings(){document.getElementById('settingsModal').classList.remove('open')}async function saveSettings(){const v=document.getElementById('instruction').value;if(v.trim().length<20)return alert(t('settingsShort'));await api('/admin/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({instruction:v})});closeSettings();toast(t('saved'))}
document.getElementById('messages').addEventListener('scroll',function(){if(this.scrollTop<90&&hasMore)loadOlder();if(isNearBottom()){document.getElementById('jumpBtn').classList.remove('show');if(currentPhone&&latestId){markSeen(currentPhone,latestId);unseenNew=0;renderPatients()}}else showJump()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();closeSettings()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('search').focus()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&currentPhone)loadChat(false)});
document.addEventListener('DOMContentLoaded',()=>{applyLanguage();loadPatients();updateGlobal();setInterval(()=>{loadPatients();if(currentPhone)loadChat(false)},4000);closeSidebar()});
</script>
</body>
</html>
